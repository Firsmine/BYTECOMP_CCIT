<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BYTECOMP - CCIT</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header>
      <div class="title">
        <h>BYTECOMP 2026</h>
        <h2>Cerdas Cermat IT</h2>
        <p>Latihan Soal Asli 2025</p>
      </div>
      <div class="soal">
        <div class="soalFinal">
          <p>Soal Final</p>
          <h3>70</h3>
        </div>
        <div class="soalPenyisihan">
          <p>Soal Penyisihan</p>
          <h3>40</h3>
        </div>
      </div>
    </header>

    <nav>
      <div class="navSection">
        <button onclick="setSection('A')" id="tabA" class="navBtn">
          Bagian A
        </button>
        <button onclick="setSection('B')" id="tabB" class="navBtn">
          Bagian B
        </button>
        <button onclick="setSection('C')" id="tabC" class="navBtn">
          Bagian C
        </button>
        <button onclick="setSection('D')" id="tabD" class="navBtn">
          Bagian D
        </button>
        <button onclick="setSection('FINAL')" id="tabFinal" class="navBtn">
          Final
        </button>
        <button onclick="setSection('KUNCI')" id="tabKunci" class="navBtn">
          Pembahasan
        </button>
      </div>
      <div class="navSearch">
        <input
          type="text"
          id="searchInput"
          oninput="applyFilters()"
          placeholder="Cari nomor, topik, kata kunci..."
        />
        <select id="topicSelect" onchange="applyFilters()">
          <option value="all">Semua Topik</option>
          <option value="sejarah">Sejarah</option>
          <option value="TI">Teknologi Informasi</option>
          <option value="komputer">Jaringan Komputer</option>
          <option value="keamanan">Keamanan Data</option>
        </select>
        <button onclick="toggleAllAnswers()" id="toggleAllBtn">
          Buka Kunci
        </button>
      </div>
    </nav>

    <main>
      <div id="questionsContainer"></div>

      <div id="emptyState" class="hidden">
        <h3>Tidak ada soal yang sesuai</h3>
        <p>Coba cari kata kunci pencaharian atau filter topik yang sesuai.</p>
      </div>
    </main>

    <footer>
      <p>Semangat.</p>
    </footer>
    <script src="js/questionA.js"></script>
    <script src="js/questionB.js"></script>
    <script src="js/questionC.js"></script>
    <script src="js/script.js"></script>
  </body>
</html>
